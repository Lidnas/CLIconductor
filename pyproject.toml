[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-conductor"
version = "0.1.0"
description = "Multi-CLI autonomous orchestration application"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "click>=8.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
conductor = "conductor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["conductor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]